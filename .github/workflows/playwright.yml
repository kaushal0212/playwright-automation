# ---------------------------------------------------------
# Name displayed in the GitHub Actions tab
# ---------------------------------------------------------
name: Playwright Tests


# ---------------------------------------------------------
# WHEN should this workflow run?
# ---------------------------------------------------------
on:

  # Run the workflow whenever code is pushed
  push:

    # Only run automatically when pushing to these branches
    branches: [ main, master ]


  # Run the workflow when a Pull Request is created/updated
  pull_request:

    # Only for PRs targeting these branches
    branches: [ main, master ]


# ---------------------------------------------------------
# JOBS
# A workflow can contain one or more jobs.
# ---------------------------------------------------------
jobs:

  # Job ID - you can call this whatever you want.
  # Here the job is called "test".
  test:

    # Maximum amount of time this job is allowed to run.
    # If it exceeds 60 minutes, GitHub will stop it.
    timeout-minutes: 60


    # The operating system where this job will execute.
    # GitHub provides a fresh Ubuntu virtual machine.
    runs-on: ubuntu-latest


    # -----------------------------------------------------
    # STEPS
    # Steps execute from top to bottom.
    # -----------------------------------------------------
    steps:


      # ---------------------------------------------------
      # STEP 1: Checkout source code
      # ---------------------------------------------------
      # Downloads your GitHub repository onto the runner.
      # Without this, the runner does not have your project.
      # ---------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # ---------------------------------------------------
      # STEP 2: Install Node.js
      # ---------------------------------------------------
      # Playwright with TypeScript/JavaScript requires Node.js.
      # ---------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4

        # Configuration for setup-node
        with:

          # Use the latest Long Term Support version of Node.js
          node-version: lts/*


      # ---------------------------------------------------
      # STEP 3: Install npm dependencies
      # ---------------------------------------------------
      # npm ci installs exactly what is defined in
      # package-lock.json.
      #
      # It is generally preferred for CI because it gives
      # repeatable dependency installation.
      # ---------------------------------------------------
      - name: Install dependencies
        run: npm ci


      # ---------------------------------------------------
      # STEP 4: Install Playwright browsers
      # ---------------------------------------------------
      # Installs browsers such as Chromium, Firefox and WebKit
      # plus required Linux dependencies.
      # ---------------------------------------------------
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps


      # ---------------------------------------------------
      # STEP 5: Run Playwright tests
      # ---------------------------------------------------
      # Executes the tests defined in your Playwright project.
      #
      # Usually this means:
      # npx playwright test
      # ---------------------------------------------------
      - name: Run Playwright tests
        run: npx playwright test


      # ---------------------------------------------------
      # STEP 6: Upload Playwright report
      # ---------------------------------------------------
      # Saves the Playwright HTML report as a GitHub artifact.
      # ---------------------------------------------------
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4


        with:

          # Name of the artifact visible in GitHub Actions
          name: playwright-report


          # Folder containing the Playwright HTML report
          path: playwright-report/


          # Keep the artifact for 30 days
          retention-days: 30
